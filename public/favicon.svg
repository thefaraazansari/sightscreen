<svg xmlns="http://www.w3.org/2000/svg" viewBox="9 -9 64 71">
  <defs>
    <!-- round wooden stump: dark edges, light centre -->
    <linearGradient id="s" x1="0" x2="1">
      <stop offset="0" stop-color="#8a5a2b"/>
      <stop offset=".3" stop-color="#e3b97a"/>
      <stop offset=".55" stop-color="#f0cf97"/>
      <stop offset="1" stop-color="#9a6a37"/>
    </linearGradient>
    <radialGradient id="r" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#e5323a"/>
      <stop offset=".55" stop-color="#b3121c"/>
      <stop offset="1" stop-color="#62060c"/>
    </radialGradient>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d9a6"/>
      <stop offset=".6" stop-color="#d9a965"/>
      <stop offset="1" stop-color="#a97a42"/>
    </linearGradient>
  </defs>
  <g id="stump">
    <path id="st" d="M13 60V18Q13 14 17 14Q21 14 21 18V60Z" fill="url(#s)"/>
    <path d="M15.2 58V19M17.4 58V18.5M19.2 58V19.5" stroke="#8a5a2b" stroke-opacity=".35" stroke-width=".5" fill="none"/>
  </g>
  <use href="#stump" x="15"/>
  <use href="#stump" x="30"/>
  <!-- bails knocked into the air -->
  <g transform="rotate(-32 24 6)">
    <rect x="15.5" y="4.3" width="17" height="3.4" rx="1.7" fill="url(#b)"/>
    <path d="M17 6H31" stroke="#8a5a2b" stroke-opacity=".3" stroke-width=".5"/>
  </g>
  <g transform="rotate(26 43 0)">
    <rect x="34.5" y="-1.7" width="17" height="3.4" rx="1.7" fill="url(#b)"/>
    <path d="M36 0H50" stroke="#8a5a2b" stroke-opacity=".3" stroke-width=".5"/>
  </g>
  <!-- the ball that hit them -->
  <circle cx="65.5" cy="40" r="6.5" fill="url(#r)"/>
  <path d="M60 36.5Q65 43 71 36.5" fill="none" stroke="#f1e4c4" stroke-width=".9" stroke-dasharray="1.2 1"/>
  <ellipse cx="63.3" cy="37" rx="2.2" ry="1.3" fill="#fff" opacity=".28" transform="rotate(-30 63.3 37)"/>
</svg>
